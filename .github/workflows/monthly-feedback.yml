name: Weekly feedback issues

on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ykqdwgqomenprbbmalqk.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_Ws6JZast0GGLQpg8ncWDCg_z4CFQT_A
      FEEDBACK_DIGEST_TOKEN: ${{ secrets.FEEDBACK_DIGEST_TOKEN }}
    steps:
      - name: Create one issue per feedback
        id: digest
        uses: actions/github-script@v7
        with:
          script: |
            const base = process.env.SUPABASE_URL;
            const headers = {
              apikey: process.env.SUPABASE_ANON_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json'
            };
            const token = process.env.FEEDBACK_DIGEST_TOKEN;
            if (!token) throw new Error('Missing repository secret FEEDBACK_DIGEST_TOKEN');
            const response = await fetch(`${base}/rest/v1/rpc/feedback_digest`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ p_token: token })
            });
            if (!response.ok) throw new Error(await response.text());
            const payload = await response.json();
            const entries = payload.entries || [];
            if (!entries.length) {
              core.notice('No open feedback entries');
              core.setOutput('count', '0');
              return;
            }

            let created = 0;
            for (const item of entries) {
              const kindLabel = item.kind === 'bug' ? 'Bug 反馈' : '意见反馈';
              const content = String(item.content || '').replace(/\r/g, '').trim();
              const body = [
                '@3481816300 请查收一条用户反馈。',
                '',
                `- 类型：${kindLabel}`,
                `- 时间：${item.created_at}`,
                `- 档位：${item.plan || '未标记'}`,
                `- 页面：${item.page || '未记录'}`,
                '',
                '## 详细情况',
                '',
                content,
                '',
                '> 联系方式已从公开 Issue 中移除，请登录游戏所有者后台直接回复用户。'
              ].join('\n');
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[${kindLabel}] ${item.title}`,
                body,
                assignees: [context.repo.owner]
              });
              const complete = await fetch(`${base}/rest/v1/rpc/feedback_digest_complete`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  p_token: token,
                  p_ids: [item.id],
                  p_issue_url: issue.data.html_url
                })
              });
              if (!complete.ok) throw new Error(await complete.text());
              created += 1;
            }
            core.setOutput('count', String(created));
            core.notice(`Created ${created} feedback issue(s)`);
