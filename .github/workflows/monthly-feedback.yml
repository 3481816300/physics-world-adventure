name: Feedback email notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-owner:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ykqdwgqomenprbbmalqk.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_Ws6JZast0GGLQpg8ncWDCg_z4CFQT_A
      FEEDBACK_DIGEST_TOKEN: ${{ secrets.FEEDBACK_DIGEST_TOKEN }}
      QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
    steps:
      - name: Prepare pending feedback
        id: prepare
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const base = process.env.SUPABASE_URL;
            const headers = {
              apikey: process.env.SUPABASE_ANON_KEY,
              Authorization: `Bearer ${process.env.SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json'
            };
            const token = process.env.FEEDBACK_DIGEST_TOKEN;
            if (!token) throw new Error('Missing repository secret FEEDBACK_DIGEST_TOKEN');
            const response = await fetch(`${base}/rest/v1/rpc/feedback_digest`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ p_token: token })
            });
            if (!response.ok) throw new Error(await response.text());
            const payload = await response.json();
            const entries = payload.entries || [];
            fs.writeFileSync('feedback-ids.json', JSON.stringify(entries.map((item) => item.id)));
            if (!entries.length) {
              core.setOutput('count', '0');
              core.notice('No pending feedback');
              return;
            }
            const bug = entries.filter((item) => item.kind === 'bug');
            const idea = entries.filter((item) => item.kind === 'idea');
            const formatEntries = (items) => items.length ? items.map((item, index) => {
              const content = String(item.content || '').replace(/\r/g, '').replace(/\n/g, '\n  ');
              return `${index + 1}. **${item.title}**\n  - 时间：${item.created_at}\n  - 档位：${item.plan || '未标记'}\n  - 页面：${item.page || '未记录'}\n  - 联系方式：${item.contact || '未填写'}\n  - 详情：${content}`;
            }).join('\n\n') : '暂无。';
            const body = [
              '物律远征收到了新的用户反馈。',
              '',
              `## Bug 反馈（${bug.length}）`,
              '',
              formatEntries(bug),
              '',
              `## 意见反馈（${idea.length}）`,
              '',
              formatEntries(idea),
              '',
              '请登录游戏所有者后台的“反馈管理”进行回复。'
            ].join('\n');
            fs.writeFileSync('feedback-email.md', body);
            core.setOutput('count', String(entries.length));
            core.notice(`${entries.length} pending feedback entr${entries.length === 1 ? 'y' : 'ies'}`);

      - name: Email owner
        id: email
        if: ${{ steps.prepare.outputs.count != '0' }}
        shell: bash
        run: |
          if [ -z "$QQ_SMTP_AUTH_CODE" ]; then
            echo "Missing repository secret QQ_SMTP_AUTH_CODE"
            exit 1
          fi
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage
          sender = "3481816300@qq.com"
          recipient = "3481816300@qq.com"
          message = EmailMessage()
          message["Subject"] = "物律远征收到新的用户反馈"
          message["From"] = sender
          message["To"] = recipient
          with open("feedback-email.md", "r", encoding="utf-8") as file:
              message.set_content(file.read())
          with smtplib.SMTP_SSL("smtp.qq.com", 465) as smtp:
              smtp.login(sender, os.environ["QQ_SMTP_AUTH_CODE"])
              smtp.send_message(message)
          PY

      - name: Mark feedback notified
        if: ${{ steps.prepare.outputs.count != '0' && steps.email.conclusion == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ids = JSON.parse(fs.readFileSync('feedback-ids.json', 'utf8'));
            const response = await fetch(`${process.env.SUPABASE_URL}/rest/v1/rpc/feedback_digest_complete`, {
              method: 'POST',
              headers: {
                apikey: process.env.SUPABASE_ANON_KEY,
                Authorization: `Bearer ${process.env.SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                p_token: process.env.FEEDBACK_DIGEST_TOKEN,
                p_ids: ids,
                p_issue_url: null
              })
            });
            if (!response.ok) throw new Error(await response.text());